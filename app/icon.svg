<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rich Golden 2048 Glow -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDA44"/>
      <stop offset="55%" stop-color="#EDC22E"/>
      <stop offset="100%" stop-color="#D99706"/>
    </linearGradient>

    <!-- Bevel / Light Top Reflection -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Shadow for Depth -->
    <filter id="tileShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7B5505" flood-opacity="0.4"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#805600" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Rounded Tile Body -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bgGrad)" filter="url(#tileShadow)"/>

  <!-- Inner Stroke / Bevel Highlight -->
  <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bevelGrad)"/>
  <rect x="42" y="42" width="428" height="428" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="8"/>

  <!-- Origami Fold Corner (Dobra) -->
  <path d="M 376 36 L 476 136 L 412 136 C 390 136 376 122 376 100 Z" fill="#FFFFFF" fill-opacity="0.25"/>

  <!-- The "2048" text: ultra-bold, perfectly centered, readable at all sizes -->
  <text 
    x="256" 
    y="304" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" 
    font-size="144" 
    font-weight="900" 
    letter-spacing="-7"
    text-anchor="middle" 
    fill="#FFFFFF"
    filter="url(#textShadow)"
  >2048</text>
</svg>
